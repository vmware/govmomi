name: Build and Push vcsim Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish vcsim to Quay.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Log in to Quay.io
        env:
          QUAY_USERNAME: ocp-splat+splat_team_push
          QUAY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: printf '%s' "$QUAY_PASSWORD" | docker login quay.io --username "$QUAY_USERNAME" --password-stdin

      - name: Build and push image
        env:
          IMAGE: quay.io/ocp-splat/vcsim
        shell: bash
        run: |
          set -euo pipefail

          tags=("sha-${GITHUB_SHA:0:12}")
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tags+=("$GITHUB_REF_NAME" "latest")
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            tags+=("latest")
          fi

          build_args=()
          for tag in "${tags[@]}"; do
            build_args+=(--tag "$IMAGE:$tag")
          done

          docker build -f vcsim/Dockerfile "${build_args[@]}" .
          for tag in "${tags[@]}"; do
            docker push "$IMAGE:$tag"
          done
